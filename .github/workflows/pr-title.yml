name: PR title

# PR titles become the squash commit message, and release-please builds the
# version and changelog from them, so they must follow Conventional Commits.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The title is passed through env, never expanded into the script.
      - name: Check Conventional Commits format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: [^[:space:]].*$'
          if [[ "$PR_TITLE" =~ $pattern ]]; then
            echo "OK: $PR_TITLE"
          else
            echo "::error::The PR title must follow Conventional Commits: '<type>(<optional scope>): <description>', e.g. 'fix: keep the queue when the server is too old'. Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert. Add '!' before ':' for a breaking change."
            exit 1
          fi

version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        update-types: [minor, patch]
    ignore:
      # The RuneLite client comes from `latest.release` and must never be pinned.
      - dependency-name: "net.runelite:*"
      # Must match the OkHttp 3.14 that RuneLite ships.
      - dependency-name: com.squareup.okhttp3:mockwebserver
        update-types: [version-update:semver-major]
      # The Plugin Hub builds with Lombok 1.18.30 (its verification template
      # replaces build.gradle), so ours stays on the same version.
      - dependency-name: org.projectlombok:lombok
      # JUnit 4, as in RuneLite's example-plugin template.
      - dependency-name: junit:junit
        update-types: [version-update:semver-major]
      # Gradle 9 needs JVM 17 to run; the plugin builds with JDK 11 to match
      # the Plugin Hub template.
      - dependency-name: gradle-wrapper
        update-types: [version-update:semver-major]
      # Test-only. 2.x/3.x change the API and drop Jackson; the contract tests
      # use 1.x.
      - dependency-name: com.networknt:json-schema-validator
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.fireside.FiresidePluginTest'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion

	// Test-only: JSON Schema (draft 2020-12) validation against the pinned
	// contract, and a mock HTTP server matching RuneLite's OkHttp version.
	// slf4j is excluded: its 2.x API would replace RuneLite's slf4j 1.7 and
	// silence logback (also in ./gradlew run, which uses the test classpath).
	testImplementation('com.networknt:json-schema-validator:1.5.9') {
		exclude group: 'org.slf4j'
	}
	testImplementation 'com.squareup.okhttp3:mockwebserver:3.14.9'
}

group = 'com.fireside'
// Keep equal to PluginVersion.VERSION and version in runelite-plugin.properties (tested).
version = '0.1.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

// Settings shared by both ways to start the dev client, so they cannot drift.
def configureDevClient = { JavaExec task ->
	task.group = 'application'
	task.classpath = sourceSets.test.runtimeClasspath
	task.mainClass = pluginMainClass

	task.jvmArgs "-ea"
	task.args "--developer-mode", "--debug"
}

// Uses the normal RuneLite directory (~/.runelite). The developer's test
// client depends on this: never give this task a different user.home.
tasks.register('run', JavaExec) {
	configureDevClient(it)
	description = 'Starts RuneLite with the plugin, using the normal RuneLite directory.'
}

// RuneLite.RUNELITE_DIR is user.home/.runelite, so a separate user.home gives
// this client its own config, queue, plugin data, logs and game cache.
def isolatedDevHome = new File(System.getProperty('user.home'), '.runelite-fireside-dev').absolutePath

tasks.register('runIsolated', JavaExec) {
	configureDevClient(it)
	description = "Starts RuneLite with the plugin, using a separate RuneLite directory under ${isolatedDevHome}."
	systemProperty 'user.home', isolatedDevHome
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': pluginMainClass, 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}
